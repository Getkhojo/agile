server {
    listen 80;
    listen [::]:80;
    server_name agiletechexpert.com www.agiletechexpert.com;

    root /var/www/agiletechexpert;
    index index.html;

    # Never serve repo internals
    location ~ /\.(git|gitignore) { deny all; return 404; }
    location /deploy/ { deny all; return 404; }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    gzip on;
    gzip_types text/html text/css application/javascript image/svg+xml;
}
