# agiletechexpert.com - static site from public/, API proxied to the backend.
# SSL managed by Let's Encrypt (certbot). Direct-IP / unknown-host access is
# rejected by 00-default-deny.conf (created on the server, not in git).

# HTTP -> HTTPS (and serve ACME renewal challenges)
server {
    listen 80;
    listen [::]:80;
    server_name agiletechexpert.com www.agiletechexpert.com;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://agiletechexpert.com$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name agiletechexpert.com www.agiletechexpert.com;

    ssl_certificate /etc/letsencrypt/live/agiletechexpert.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agiletechexpert.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # www -> apex
    if ($host = www.agiletechexpert.com) { return 301 https://agiletechexpert.com$request_uri; }

    root /var/www/agiletechexpert/public;
    index index.html;
    error_page 404 /404.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "microphone=(self), camera=(), geolocation=()" always;

    # HTML: no cache so updates show immediately
    expires -1;

    location / {
        try_files $uri $uri/ =404;
    }

    location /assets/ {
        expires 7d;
        access_log off;
    }

    # Backend API (leads, and later auth + assistant)
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml;
}
