# agiletechexpert.com - static site from public/, API proxied to the backend later
server {
    listen 80;
    listen [::]:80;
    server_name agiletechexpert.com www.agiletechexpert.com;

    root /var/www/agiletechexpert/public;
    index index.html;
    error_page 404 /404.html;

    # Redirect www to the bare domain
    if ($host = www.agiletechexpert.com) { return 301 https://agiletechexpert.com$request_uri; }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "microphone=(self), camera=(), geolocation=()" always;
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    location = /sitemap.xml { add_header Content-Type application/xml; }

    # Backend API (enable once the backend service is running on port 8000)
    # location /api/ {
    #     proxy_pass http://127.0.0.1:8000;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection "upgrade";
    # }

    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml application/xml;
}
